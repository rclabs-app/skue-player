<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Cyan to Purple Wave Gradient -->
    <linearGradient id="skue-mark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="45%" stop-color="#0EA5E9"/>
      <stop offset="80%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Glowing wave blur filter -->
    <filter id="skue-mark-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Modern Dynamic Stream Ribbon: Futuristic 'S' mark with forward play motion -->
  <g filter="url(#skue-mark-glow)">
    <!-- Top Sweeping Loop (Electric Cyan to Blue) -->
    <path 
      d="M 22 28 C 22 18, 38 12, 58 12 C 78 12, 88 22, 88 34 C 88 48, 68 52, 48 56 C 30 60, 18 66, 18 80 C 18 94, 34 98, 56 98 C 76 98, 88 90, 88 84" 
      stroke="url(#skue-mark-grad)" 
      stroke-width="13" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Internal vibrant Play Sparkle (Cinema Play motion) -->
    <polygon points="50,42 66,52 50,62" fill="#00F0FF" opacity="0.9" />
  </g>
</svg>
