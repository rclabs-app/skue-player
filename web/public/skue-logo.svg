<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 12 205 78" fill="none">
  <defs>
    <!-- Cyan to Purple Wave Gradient -->
    <linearGradient id="skue-web-logo-wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="35%" stop-color="#0EA5E9"/>
      <stop offset="70%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Metallic Highlight for E top right -->
    <linearGradient id="skue-web-logo-e-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <filter id="skue-web-logo-wave-glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur1" />
      <feGaussianBlur stdDeviation="0.8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

