ServerName localhost
PidFile /tmp/apache2/apache2.pid
DocumentRoot /var/www/html/public
<Directory /var/www/html/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
# Never put request targets or query strings containing playlist data in access logs.
LogFormat "%h %t %m %>s %b" skue
CustomLog /proc/self/fd/1 skue
ErrorLog /proc/self/fd/2
