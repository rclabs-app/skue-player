<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 50" fill="none" class="h-9 w-auto">
  <defs>
    <linearGradient id="skue-e-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="skue-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Letter S -->
  <path d="M 28 11.5 C 26 9.5 22.5 8 18 8 C 11.5 8 7 11.5 7 16.5 C 7 26 29 20.5 29 30.5 C 29 36 24 39.5 17 39.5 C 10.5 39.5 6 36.5 4 33.5" 
        stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Letter K -->
  <path d="M 43 8 L 43 39 M 64 8 L 46 23.5 M 49 20.5 L 65 39" 
        stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Letter U -->
  <path d="M 80 8 L 80 26 C 80 34 86 39.5 95 39.5 C 104 39.5 110 34 110 26 L 110 8" 
        stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Letter E (Stylized 3 horizontal rounded bars with vibrant cyan-blue gradient) -->
  <rect x="124" y="8" width="28" height="5" rx="2.5" fill="url(#skue-e-grad)" filter="url(#skue-glow)" />
  <rect x="124" y="21" width="24" height="5" rx="2.5" fill="url(#skue-e-grad)" filter="url(#skue-glow)" />
  <rect x="124" y="34" width="28" height="5" rx="2.5" fill="url(#skue-e-grad)" filter="url(#skue-glow)" />

  <!-- Tagline SEE MORE -->
  <text x="88" y="47" text-anchor="middle" font-family="'Instrument Sans', -apple-system, sans-serif" font-size="5" font-weight="700" letter-spacing="4.5" fill="#64748b">SEE MORE</text>
</svg>
