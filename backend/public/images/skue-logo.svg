<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 62" fill="none" class="h-10 w-auto">
  <defs>
    <!-- K Lower Leg Metallic Reflection Gradient -->
    <linearGradient id="skue-k-reflection" x1="0%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.95"/>
    </linearGradient>

    <!-- E Bottom Bracket Oceanic Cyan/Blue Gradient -->
    <linearGradient id="skue-e-bracket" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Subtle Glow Filter for the E accent -->
    <filter id="skue-glow-accent" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g id="skue-wordmark" class="text-gray-900 dark:text-white" fill="currentColor">
    <!-- Letter S -->
    <path d="M 33.5 14.5 C 31 10.5 26.5 8 20 8 C 11.5 8 6 12.5 6 18.5 C 6 29 32.5 24 32.5 34 C 32.5 40 27 44 19.5 44 C 11.5 44 6.5 39.5 4.5 35.5 L 9.5 32 C 11 35 14.5 38 19.5 38 C 23.5 38 26.5 35.5 26.5 32 C 26.5 23 0 27 0 17 C 0 10 6 2 20 2 C 27.5 2 34 5.5 37.5 11 L 33.5 14.5 Z" />

    <!-- Letter K -->
    <!-- Vertical stem -->
    <rect x="47" y="3" width="6.5" height="40" rx="0.5" />
    <!-- Upper diagonal arm -->
    <path d="M 53.5 23.5 L 68 5 L 76.5 5 L 59.5 25.5 Z" />
    <!-- Lower diagonal leg with metallic chrome reflection -->
    <path d="M 58 23.5 L 74 43 L 83 43 L 64.5 20.5 Z" fill="url(#skue-k-reflection)" />

    <!-- Letter U -->
    <path d="M 94 3 L 100.5 3 L 100.5 28 C 100.5 35 105 38.5 112 38.5 C 119 38.5 123.5 35 123.5 28 L 123.5 3 L 130 3 L 130 28 C 130 39 122.5 44 112 44 C 101.5 44 94 39 94 28 L 94 3 Z" />

    <!-- Letter E -->
    <!-- Top separate horizontal bar -->
    <rect x="144" y="3" width="32" height="6.5" rx="0.5" />
    <!-- Connected middle bar, vertical spine and bottom glowing gradient bar -->
    <path d="M 144 19.5 L 171 19.5 L 171 26 L 150.5 26 L 150.5 36.5 L 176 36.5 L 176 43 L 144 43 Z" 
          fill="url(#skue-e-bracket)" filter="url(#skue-glow-accent)" />
  </g>

  <!-- Tagline: SEE MORE -->
  <text x="100" y="58" text-anchor="middle" 
        font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="6.5" font-weight="600" letter-spacing="7" fill="#64748B" opacity="0.9">SEE MORE</text>
</svg>
